[project]
name = "swissdelay"
version = "0.1.0"
description = "Leakage-safe benchmark of train-delay propagation on Swiss operating data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Selim Benabdallah" }]
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pre-commit>=3.8",
    "plotly>=7.1.0",
    "nbformat>=5.11.1",
]
# Installed later with: uv sync --group dl
dl = [
    "torch>=2.4",
    "torch-geometric>=2.6",
]
# API, dashboard and their tests: uv sync --group serve
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swissdelay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
